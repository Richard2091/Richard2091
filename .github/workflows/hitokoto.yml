name: 更新今日一句

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: 更新今日一句
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 更新 README 占位区
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const path = "README.md";
            const start = "<!-- HITOKOTO:START -->";
            const end = "<!-- HITOKOTO:END -->";
            const response = await fetch("https://v1.hitokoto.cn/?encode=json&c=d&c=i&c=k");
            if (!response.ok) {
              throw new Error(`hitokoto request failed: ${response.status}`);
            }
            const data = await response.json();
            const sentence = String(data.hitokoto || "").trim();
            const from = String(data.from || "").trim();
            const next = from ? `${sentence}\n\n> ${from}` : sentence;
            const source = fs.readFileSync(path, "utf8");
            const pattern = new RegExp(`${start}[\\s\\S]*?${end}`);
            if (!pattern.test(source)) {
              core.setFailed("README.md 缺少 HITOKOTO 占位标记");
              return;
            }
            const updated = source.replace(pattern, `${start}\n${next}\n${end}`);
            fs.writeFileSync(path, updated, "utf8");

      - name: 提交更新
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: 更新今日一句"
          file_pattern: README.md
