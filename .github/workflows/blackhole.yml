name: 生成贡献黑洞动画

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    name: 生成贡献黑洞动画
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v7

      - name: 生成 SVG
        run: node scripts/contribution-blackhole.mjs "${{ github.repository_owner }}" dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 发布到 output 分支
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
